<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Электрондық оқу құралы — Кітап форматы</title>
  <style>
    body {
      background: #334155;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #1e293b;
    }
    h1 {
      color: #f8fafc;
      font-size: 20px;
      margin-bottom: 15px;
      text-align: center;
    }
    /* Кітап контейнері */
    .book-container {
      perspective: 1500px;
    }
    .book {
      width: 800px;
      height: 520px;
      background: #f8fafc;
      border-radius: 8px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      position: relative;
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }
    .page {
      width: 50%;
      height: 100%;
      padding: 40px;
      box-sizing: border-box;
      overflow-y: auto;
      position: absolute;
      top: 0;
      transition: transform 0.6s ease-in-out;
      background: #ffffff;
    }
    .page-left {
      left: 0;
      border-right: 1px solid #e2e8f0;
      box-shadow: inset -10px 0 15px -10px rgba(0,0,0,0.05);
    }
    .page-right {
      right: 0;
      background: #fdfdfd;
    }
    h2 { font-size: 18px; color: #1e40af; margin-bottom: 12px; }
    p, li { font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
    ul, ol { margin-left: 20px; }
    pre { background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 6px; font-size: 12px; }
    code { color: #db2777; background: #f1f5f9; padding: 2px 4px; border-radius: 4px; }
    pre code { color: #e2e8f0; background: transparent; }
    
    /* Батырмалар */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .page-counter {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Веб-программирование — Электронды кітап (ОӘК)</h1>

  <div class="book-container">
    <div class="book">
      <div class="page page-left" id="left-page">
        <!-- Сол жақ бет мазмұны -->
      </div>
      <div class="page page-right" id="right-page">
        <!-- Оң жақ бет мазмұны -->
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prev-btn" onclick="prevPage()">← Алдыңғы бет</button>
    <button class="btn" id="next-btn" onclick="nextPage()">Келесі бет →</button>
  </div>
  <div class="page-counter" id="counter">Бет: 1 / 30</div>

  <script src="lectures.js"></script>
  <script src="srsp.js"></script>
  <script>
    // Барлық мазмұнды біріктіреміз: 15 лекция + 15 СРСП = 30 беттік кітап
    const bookPages = [];
    
    window.LECTURES_DATA.forEach((item, index) => {
      bookPages.push({
        title: `Дәріс №${index + 1}: ${item.title}`,
        html: item.html,
        source: item.source
      });
    });

    window.SRSP_DATA.forEach((item, index) => {
      bookPages.push({
        title: `СРСП Тапсырмасы №${index + 1}: ${item.title}`,
        html: item.html,
        source: item.source
      });
    });

    let currentPage = 0; // Жұп индекс (сол жақ бет)

    function renderBook() {
      const leftPage = bookPages[currentPage] || { title: "Аяғы", html: "<p>Кітап соңы.</p>", source: "" };
      const rightPage = bookPages[currentPage + 1] || { title: "Мұқаба", html: "<p>Оқу құралының соңы.</p>", source: "" };

      document.getElementById('left-page').innerHTML = `
        <h2>${leftPage.title}</h2>
        <div>${leftPage.html}</div>
        <p style="font-size:11px; color:#64748b; margin-top:15px;">Дереккөз: ${leftPage.source || ''}</p>
      `;

      document.getElementById('right-page').innerHTML = `
        <h2>${rightPage.title}</h2>
        <div>${rightPage.html}</div>
        <p style="font-size:11px; color:#64748b; margin-top:15px;">Дереккөз: ${rightPage.source || ''}</p>
      `;

      document.getElementById('prev-btn').disabled = currentPage === 0;
      document.getElementById('next-btn').disabled = currentPage >= bookPages.length - 2;
      
      let currentNum = Math.min(currentPage + 2, bookPages.length);
      document.getElementById('counter').textContent = `Беттер: ${currentNum} / ${bookPages.length}`;
    }

    function nextPage() {
      if (currentPage < bookPages.length - 2) {
        currentPage += 2;
        renderBook();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage -= 2;
        renderBook();
      }
    }

    window.onload = () => renderBook();
  </script>
</body>
</html>
