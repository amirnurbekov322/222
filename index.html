<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Электрондық оқу құралы — Анимацияланған кітап</title>
  <style>
    body {
      background: #1e293b;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #1e293b;
    }
    h1 {
      color: #f8fafc;
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    /* Кітап мұқабасы мен контейнері */
    .book-container {
      position: relative;
      width: 840px;
      height: 520px;
      background: #fdfdfd;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      border: 1px solid #cbd5e1;
      overflow: hidden;
    }
    .page {
      width: 50%;
      height: 100%;
      padding: 40px;
      box-sizing: border-box;
      overflow-y: auto;
      background: #ffffff;
      transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
    }
    .page-left {
      border-right: 1px solid #e2e8f0;
      box-shadow: inset -15px 0 20px -15px rgba(0,0,0,0.06);
    }
    .page-right {
      background: #fafafa;
    }
    
    /* Бет ауысқан кездегі анимация класы */
    .fade-anim {
      opacity: 0;
      transform: scale(0.98);
    }

    h2 { font-size: 17px; color: #1e40af; margin-bottom: 12px; }
    p, li { font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
    ul, ol { margin-left: 20px; }
    pre { background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 6px; font-size: 12px; }
    code { color: #db2777; background: #f1f5f9; padding: 2px 4px; border-radius: 4px; }
    pre code { color: #e2e8f0; background: transparent; }
    
    /* Батырмалар мен санауыш */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #2563eb; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { background: #64748b; cursor: not-allowed; opacity: 0.6; }
    .page-counter {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 10px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <h1>Web Programming — Электронды оқу құралы (УМКД)</h1>

  <div class="book-container">
    <div class="page page-left" id="left-page"></div>
    <div class="page page-right" id="right-page"></div>
  </div>

  <div class="controls">
    <button class="btn" id="prev-btn" onclick="prevPage()">← Алдыңғы</button>
    <button class="btn" id="next-btn" onclick="nextPage()">Келесі →</button>
  </div>
  <div class="page-counter" id="counter">Беттер: 1-2 / 30</div>

  <script src="lectures.js"></script>
  <script src="srsp.js"></script>
  <script>
    const bookPages = [];
    
    // 15 Лекцияны қосу
    window.LECTURES_DATA.forEach((item, index) => {
      bookPages.push({
        title: `Дәріс №${index + 1}: ${item.title}`,
        html: item.html,
        source: item.source
      });
    });

    // 15 СРСП тапсырмасын қосу
    window.SRSP_DATA.forEach((item, index) => {
      bookPages.push({
        title: `СРСП Тапсырмасы №${index + 1}: ${item.title}`,
        html: item.html,
        source: item.source
      });
    });

    let currentPage = 0;

    function renderBook(withAnimation = true) {
      const leftEl = document.getElementById('left-page');
      const rightEl = document.getElementById('right-page');

      if (withAnimation) {
        leftEl.classList.add('fade-anim');
        rightEl.classList.add('fade-anim');
      }

      setTimeout(() => {
        const leftPage = bookPages[currentPage] || { title: "Аяғы", html: "<p>Кітап соңы.</p>", source: "" };
        const rightPage = bookPages[currentPage + 1] || { title: "Мұқаба", html: "<p>Оқу құралының соңы.</p>", source: "" };

        leftEl.innerHTML = `
          <h2>${leftPage.title}</h2>
          <div>${leftPage.html}</div>
          <p style="font-size:11px; color:#64748b; margin-top:15px;">Дереккөз: ${leftPage.source || ''}</p>
        `;

        rightEl.innerHTML = `
          <h2>${rightPage.title}</h2>
          <div>${rightPage.html}</div>
          <p style="font-size:11px; color:#64748b; margin-top:15px;">Дереккөз: ${rightPage.source || ''}</p>
        `;

        document.getElementById('prev-btn').disabled = currentPage === 0;
        document.getElementById('next-btn').disabled = currentPage >= bookPages.length - 2;
        
        let currentNum = Math.min(currentPage + 2, bookPages.length);
        document.getElementById('counter').textContent = `Беттер: ${Math.min(currentPage + 1, bookPages.length)} мен ${currentNum} / ${bookPages.length}`;

        if (withAnimation) {
          leftEl.classList.remove('fade-anim');
          rightEl.classList.remove('fade-anim');
        }
      }, 200);
    }

    function nextPage() {
      if (currentPage < bookPages.length - 2) {
        currentPage += 2;
        renderBook(true);
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage -= 2;
        renderBook(true);
      }
    }

    window.onload = () => renderBook(false);
  </script>
</body>
</html>
